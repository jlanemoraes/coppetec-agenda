apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenda-coppetec
spec:
  template:
    spec:
      containers:
        - name: agenda-coppetec
          env:
            - name: SERVER_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            capabilities:
              add: []
              drop:
                - ALL
