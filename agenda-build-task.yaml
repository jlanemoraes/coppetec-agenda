apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: agenda-build-push
  namespace: cicd
spec:
  params:
    - name: repo-url
      type: string

    - name: revision
      type: string
      default: main

    - name: image
      type: string

    - name: skip-tls-verify
      type: string
      default: "true"

  workspaces:
    - name: shared

    - name: git-auth
      readOnly: true

    - name: dockerconfig
      readOnly: true
      mountPath: /kaniko/.docker

  steps:
    - name: clone
      image: alpine/git:v2.54.0

      env:
        - name: HOME
          value: /tekton/home

      script: |
        #!/bin/sh
        set -eu

        mkdir -p "${HOME}"

        cp "$(workspaces.git-auth.path)/.git-credentials" \
          "${HOME}/.git-credentials"

        cp "$(workspaces.git-auth.path)/.gitconfig" \
          "${HOME}/.gitconfig"

        chmod 600 \
          "${HOME}/.git-credentials" \
          "${HOME}/.gitconfig"

        rm -rf "$(workspaces.shared.path)/source"

        git clone \
          --branch "$(params.revision)" \
          --single-branch \
          "$(params.repo-url)" \
          "$(workspaces.shared.path)/source"

    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2-debug

      script: |
        #!/busybox/sh
        set -eu

        EXTRA_ARGS=""

        if [ "$(params.skip-tls-verify)" = "true" ]; then
          EXTRA_ARGS="--skip-tls-verify"
        fi

        /kaniko/executor \
          --context="dir://$(workspaces.shared.path)/source" \
          --dockerfile="$(workspaces.shared.path)/source/Dockerfile" \
          --destination="$(params.image)" \
          --snapshot-mode=redo \
          ${EXTRA_ARGS}
