apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenda-coppetec
  labels:
    app: agenda-coppetec
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agenda-coppetec
  template:
    metadata:
      labels:
        app: agenda-coppetec
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

      imagePullSecrets:
        - name: harbor-pull-secret

      containers:
        - name: agenda-coppetec
          image: 192.168.1.188:8443/agenda/agenda-coppetec:1.0.10
          imagePullPolicy: Always

          args:
            - "--server.port=8080"

          env:
            - name: DATABASE_URL
              value: jdbc:sqlite:/app/data/agenda.db

            - name: SERVER_PORT
              value: "8080"

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenda-coppetec-admin
                  key: password

            - name: SESSION_COOKIE_SECURE
              value: "true"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

          volumeMounts:
            - name: agenda-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: agenda-data
          persistentVolumeClaim:
            claimName: agenda-coppetec-data
        - name: tmp
          emptyDir: {}
