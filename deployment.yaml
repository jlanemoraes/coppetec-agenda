apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenda-coppetec
  labels:
    app.kubernetes.io/name: agenda-coppetec
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agenda-coppetec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agenda-coppetec
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: agenda-coppetec
          image: HARBOR_HOST/HARBOR_PROJECT/agenda-coppetec:1.0.1
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: jdbc:sqlite:/app/data/agenda.db
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenda-coppetec-admin
                  key: password
            - name: SESSION_COOKIE_SECURE
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agenda-coppetec-data
        - name: tmp
          emptyDir: {}
