apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: agenda-coppetec-build-
  namespace: cicd
spec:
  pipelineRef:
    name: agenda-coppetec-ci
  taskRunTemplate:
    serviceAccountName: tekton-bot
    podTemplate:
      securityContext:
        fsGroup: 65532
  params:
    - name: app-git-url
      value: APP_GIT_URL
    - name: app-git-revision
      value: main
    - name: image-repository
      value: HARBOR_HOST/HARBOR_PROJECT/agenda-coppetec
    - name: image-tag
      value: "1.0.1"
    - name: gitops-git-url
      value: GITOPS_GIT_URL
    - name: gitops-git-revision
      value: main
    - name: kustomization-path
      value: apps/agenda-coppetec/kustomization.yaml
    - name: insecure-registry
      value: "false"
    - name: skip-tls-verify
      value: "false"
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: microk8s-hostpath
          resources:
            requests:
              storage: 3Gi
    - name: dockerconfig
      secret:
        secretName: harbor-push-secret
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: git-auth
      secret:
        secretName: git-basic-auth
